apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipments-api
  namespace: prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shipments-api
  template:
    metadata:
      labels:
        app: shipments-api
    spec:
      containers:
        - name: api
          image: registry.example.com/shipments-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: shipments-api
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
