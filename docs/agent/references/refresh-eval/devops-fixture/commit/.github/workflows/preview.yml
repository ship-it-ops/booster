name: Preview environment

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install && npm test
      - name: Build and push
        run: |
          TAG="pr-${{ github.event.number }}-${{ github.sha }}"
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ vars.REGISTRY }} -u ci --password-stdin
          docker build -t ${{ vars.REGISTRY }}/shipments-api:$TAG .
          docker push ${{ vars.REGISTRY }}/shipments-api:$TAG
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Deploy preview
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          NAMESPACE="preview-${{ github.head_ref }}"
          kubectl --kubeconfig kubeconfig create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl --kubeconfig kubeconfig apply -f -
          kubectl --kubeconfig kubeconfig -n "$NAMESPACE" apply -f k8s/
          kubectl --kubeconfig kubeconfig -n "$NAMESPACE" set image deployment/shipments-api api=${{ vars.REGISTRY }}/shipments-api:$TAG
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: "Preview deployed to namespace preview-${{ github.head_ref }}"
            })
