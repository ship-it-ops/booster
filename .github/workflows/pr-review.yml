name: PR Review

# Dogfoods the ship-reviewed-prs plugin against PRs to this repository so we
# notice regressions before they ship to downstream consumers (e.g. ShipIt-AI).
#
# Required repo secret: CLAUDE_CODE_OAUTH_TOKEN
#
# Important: the action installs the plugin from the LOCAL checkout (the PR
# merge ref), so each PR is reviewed by the version of the plugin it proposes —
# plugin changes self-review on the same PR. This is convenient for fast
# iteration on plugin logic but means a malicious PR could rewrite SKILL.md to
# affect the reviewer (e.g. exfiltrate the workflow's GITHUB_TOKEN). Mitigated
# by GitHub's "Require approval for all outside collaborators" setting — runs
# from non-member contributors must be manually approved before the workflow
# executes. If that setting is ever relaxed, flip `plugin_marketplaces` back
# to the marketplace URL ('https://github.com/ship-it-ops/booster.git') to
# restore main-only review.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    # Skip drafts (reviewed when marked ready) and pull requests from forks,
    # whose token is read-only.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: read
      statuses: read
      issues: write   # the skip notice below is an issue comment
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need history reaching the base ref so the workflow-change diff
          # below can compare against it.
          fetch-depth: 0

      # The Claude action only runs against the workflow definition on the
      # default branch — a security measure so a PR can't modify the prompt
      # to exfiltrate secrets. If this PR touches this workflow file itself,
      # skip the review with an explanatory comment instead of running a
      # potentially-tampered prompt.
      - name: Detect changes to this workflow file
        id: workflow_check
        run: |
          base="${{ github.event.pull_request.base.ref }}"
          if git diff --name-only "origin/$base...HEAD" -- .github/workflows/pr-review.yml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          # Because the plugin is installed from this checkout, a pull request
          # that changes the reviewer, CI or agent configuration is reviewed by
          # code it supplies. Ask for a comment-only review in that case. This
          # is a request to the reviewer, not an enforcement: the code that
          # honours the flag comes from the pull request too. What actually
          # bounds the risk is the repository setting that requires approval
          # before workflows run for outside contributors (see the header).
          if git diff --name-only "origin/$base...HEAD" -- skills/ship-reviewed-prs plugins/ship-reviewed-prs .claude .claude-plugin .mcp.json .github CLAUDE.md AGENTS.md | grep -q .; then
            echo "review_flags=--non-interactive --comment-only" >> "$GITHUB_OUTPUT"
          else
            echo "review_flags=--non-interactive" >> "$GITHUB_OUTPUT"
          fi

      - name: Post skip notice (this workflow modified)
        if: steps.workflow_check.outputs.changed == 'true'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const marker = '<!-- claude-review-skip-workflow-changed -->';
            const body = [
              marker,
              '⏭️ **Claude review skipped on this PR**',
              '',
              'This PR modifies `.github/workflows/pr-review.yml`, the workflow that defines this review. The automated review only runs against the workflow definition on the default branch (a safety guard so a PR cannot rewrite its own reviewer prompt), so it is suppressed here.',
              '',
              'Once this PR is merged into `main`, future PRs will be reviewed against the updated workflow. You can mention `@claude` in a comment if you want a manual review on this PR.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Run Claude Code Review
        id: claude-review
        if: steps.workflow_check.outputs.changed != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          # The skill posts the review through `gh` as the workflow token's
          # account (github-actions[bot]).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Install from the local checkout (PR merge ref) rather than the
          # marketplace URL. PRs that touch the plugin self-review with their
          # own changes; see header comment for the trust-model tradeoff. The
          # step above asks for a comment-only review when the pull request
          # changes the reviewer.
          plugin_marketplaces: './'
          plugins: 'ship-reviewed-prs@booster'
          # The namespaced command and `--non-interactive` are both required:
          # see docs/agent/scars/bare-slash-command-unknown-in-action.md and
          # docs/agent/scars/ci-mode-auto-detect-unreliable.md.
          prompt: '/ship-reviewed-prs:review-pr ${{ github.event.pull_request.number }} ${{ steps.workflow_check.outputs.review_flags }}'
          # Turn on only while investigating a run that posted nothing: it
          # puts the whole session in the job log.
          # show_full_output: true

      # A model cannot set an exit code, so this step is what makes the job
      # red when no review was posted or the review requests changes.
      - name: Check that a review was posted
        if: always() && !cancelled() && steps.workflow_check.outputs.changed != 'true'
        run: |
          result="$RUNNER_TEMP/ship-review/result.json"
          if [ ! -f "$result" ]; then
            echo "::error::ship-reviewed-prs did not post a review (no result file)."
            exit 1
          fi
          cat "$result"
          posted="$(jq -r '.posted' "$result")"
          skipped="$(jq -r '.skipped // ""' "$result")"
          event="$(jq -r '.event // ""' "$result")"
          if [ "$posted" != "true" ] && [ "$skipped" != "already-reviewed" ] && [ "$skipped" != "closed" ]; then
            echo "::error::ship-reviewed-prs did not post a review: $(jq -r '(.notes // []) | join(" ")' "$result")"
            exit 1
          fi
          echo "::notice::Review verdict: $(jq -r '.verdict // "none"' "$result") (posted as ${event:-nothing}${skipped:+, $skipped})"
          if [ "$event" = "REQUEST_CHANGES" ]; then
            echo "::error::The review requests changes."
            exit 1
          fi
